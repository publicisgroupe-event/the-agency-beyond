<!DOCTYPE html>
<html lang="zh-Hant">

<!-- 預先載入主視覺：只會載入符合裝置的那一張 -->
<link rel="preload" as="image" href="2-pc.jpg" media="(min-width: 769px)">
<link rel="preload" as="image" href="2-mb.jpg" media="(max-width: 768px)">
<style>

.event-page-wrapper *{ box-sizing: border-box; margin:0; padding:0; }

.event-page-wrapper{
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft YaHei", sans-serif;
  background-color: #000000 !important;
  color: #ffffff !important;
}

.event-page-wrapper img{ display:block; max-width:100%; }
.event-page-wrapper section{ position: relative; width: 100%; }

/* 1. 頂端 LOGO 區 */
.event-page-wrapper .section-logo{
  background-color: #000000 !important;
  padding: 18px 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.event-page-wrapper .section-logo img{
  height: 60px;
  width: auto;
  object-fit: contain;
}
@media (max-width: 768px){
  .event-page-wrapper .section-logo{ padding: 14px 0 8px; }
  .event-page-wrapper .section-logo img{ height: 44px; }
}

/* 2. 滿版活動主視覺區（<picture> 依裝置只載入一張） */
.event-page-wrapper .section-hero{
  background-color: #000000 !important;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}
.event-page-wrapper .hero-media-wrap{
  width: 100%;
  position: relative;
  overflow: hidden;
}
.event-page-wrapper .hero-media-wrap picture{ display: block; }
.event-page-wrapper .hero-media{
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}
.event-page-wrapper .hero-cta-wrap{
  padding: 16px 0 56px;
  background-color: #000000 !important;
  width: 100%;
  display: flex;
  justify-content: center;
}
.event-page-wrapper .btn-cta{
  background-color: #BCAB78 !important;
  color: #ffffff !important;
  border: none;
  padding: 16px 48px;
  border-radius: 999px;
  font-size: 18px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .3s ease, box-shadow .3s ease;
  text-decoration: none;
  display: inline-block;
  font-family: inherit;
}
.event-page-wrapper .btn-cta:hover{
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(188,171,120,.4);
}
@media (max-width: 768px){

/* 3 & 4. 主題區共用 */
.event-page-wrapper .section-theme{
background-color: #000000 !important;
padding: 130px 5% 110px;
position: relative;
}
.event-page-wrapper .theme-title{
  text-align: center;
  font-size: 2.4rem;
  letter-spacing: 6px;
  margin-bottom: 14px;
  font-weight: 500;
  color: #ffffff !important;
}
.event-page-wrapper .theme-subtitle{
  text-align: center;
  font-size: 1.1rem;
  font-weight: 300;
  letter-spacing: 2px;
  line-height: 1.6;
  color: #9a9a9a !important;
  margin-bottom: 56px;
}

/* 3. 《獅紀：無界》卡片輪播（右側漸層提示） */
.event-page-wrapper .theme2::after{
content: '';
position: absolute;
top: 130px;
right: 0;
bottom: 134px;
width: 80px;
background: linear-gradient(to right, transparent, #000000);
pointer-events: none;
}
.event-page-wrapper .card-carousel{
  display: flex;
  gap: 24px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding-bottom: 24px;
  -webkit-overflow-scrolling: touch;
}
.event-page-wrapper .card-carousel::-webkit-scrollbar{ height: 6px; }
.event-page-wrapper .card-carousel::-webkit-scrollbar-thumb{
  background-color: rgba(255,255,255,.3);
  border-radius: 3px;
}
.event-page-wrapper .card{
  flex: 0 0 260px;
  scroll-snap-align: start;
  border-radius: 28px;
  overflow: hidden;
  position: relative;
  aspect-ratio: 3 / 4;
  display: flex;
  flex-direction: column;
}
.event-page-wrapper .card img{
  width: 100%;
  height: 62%;
  object-fit: cover;
  background-color: rgba(255,255,255,.08);
}
.event-page-wrapper .card .card-text{
  flex: 1;
  padding: 18px 20px;
  font-size: 1.25rem;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.event-page-wrapper .theme2 .card{ background-color: #BCAB78 !important; }
.event-page-wrapper .theme2 .card .card-text{ color: #ffffff !important; }
.event-page-wrapper .theme2 .card-sub{
  display: block;
  width: 100%;
  margin-top: 6px;
}
.event-page-wrapper .theme2 .card-sub-line{
  display: block;
  width: 100%;
  font-size: 1rem;
  line-height: 1.4;
  opacity: 0.9;
}

/* 4. 《獅紀：百變》單張主圖（<picture> 依裝置只載入一張） */
.event-page-wrapper .theme-single-wrap{ display: block; }
.event-page-wrapper .theme-single-img{
  display: block;
  width: 100%;
  max-width: 1024px;
  height: auto;
  margin: 0 auto;
  border-radius: 20px;
}

@media (max-width: 768px){
.event-page-wrapper .section-theme{ padding: 70px 5% 60px; }
.event-page-wrapper .theme2::after{ display: none; }
.event-page-wrapper .theme-title{ font-size: 1.6rem; letter-spacing: 3px; margin-bottom: 10px; }

.event-page-wrapper .card{ flex: 0 0 269px; }
.event-page-wrapper .card .card-text{ font-size: 1.15rem; }
.event-page-wrapper .theme2 .card-sub-line{ font-size: 0.9rem; }
.event-page-wrapper .theme-single-img{ max-width: 683px; }
}

/* 5. 地址時間 + 兩顆按鈕 */
.event-page-wrapper .section-story{
  position: relative;
  background-color: #000000 !important;
}
.event-page-wrapper .story-bg{
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 6%;
}
.event-page-wrapper .story-panel{
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 48px;
  max-width: 1000px;
  width: 100%;
}
.event-page-wrapper .story-text-img{
  display: block;
  width: 55%;
  max-width: 560px;
  height: auto;
}
.event-page-wrapper .story-btns{
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 18px;
}
.event-page-wrapper .btn-info{
  display: block;
  text-align: center;
  background-color: #BCAB78 !important;
  color: #ffffff !important;

  padding: 16px 48px;
  border-radius: 999px;
  font-size: 18px;
  letter-spacing: 3px;
  white-space: nowrap;
  transition: transform .3s ease, box-shadow .3s ease;
}
.event-page-wrapper .btn-info:hover{
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(188,171,120,.4);
}
@media (max-width: 768px){
.event-page-wrapper .story-bg{ padding: 40px 5%; }
.event-page-wrapper .story-panel{
  flex-direction: column;
  gap: 24px;
  width: 100%;
}
.event-page-wrapper .story-text-img{ width: 100%; max-width: none; }
.event-page-wrapper .story-btns{
  width: auto;
  align-items: center;
  gap: 14px;
}
.event-page-wrapper .btn-info{
  display: inline-block;
  width: auto;
  min-width: 220px;
  padding: 18px 46px;
  font-size: 18px;
  letter-spacing: 2px;
}
}

/* 6. Registration Form 區 */
.event-page-wrapper .section-form{
  background-color: #0d0d0d !important;
  padding: 100px 5%;
}
.event-page-wrapper .form-title{
  text-align: center;
  font-size: 1.8rem;
  letter-spacing: 4px;
  margin-bottom: 44px;
  color: #ffffff !important;
}
.event-page-wrapper .form-card{
  max-width: 480px;
  margin: 0 auto;
  background-color: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 24px;
  padding: 44px 36px;
  backdrop-filter: blur(6px);
}
.event-page-wrapper .form-group{ margin-bottom: 22px; }
.event-page-wrapper .form-group label{
  display: block;
  font-size: 0.85rem;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
  color: rgba(255,255,255,.8) !important;
}
.event-page-wrapper .form-group input{
  width: 100%;
  padding: 13px 16px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.25);
  background-color: rgba(255,255,255,.05);
  color: #ffffff !important;
  font-size: 1rem;
  font-family: inherit;
}
.event-page-wrapper .form-group input::placeholder{ color: rgba(255,255,255,.35); }
.event-page-wrapper .form-group input:focus{
  outline: none;
  border-color: rgba(255,255,255,.6);
}
.event-page-wrapper .slot-options{ display: flex; flex-direction: column; gap: 10px; }
.event-page-wrapper .slot-option{
  display: flex !important;
  align-items: center;
  gap: 12px;
  margin: 0 !important;
  padding: 13px 16px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.25);
  background-color: rgba(255,255,255,.05);
  font-size: 1rem !important;
  letter-spacing: 1px;
  color: #ffffff !important;
  cursor: pointer;
}
.event-page-wrapper .slot-option input{ width: auto; accent-color: #BCAB78; }
.event-page-wrapper .slot-option:has(input:checked){ border-color: #BCAB78; }
.event-page-wrapper .slot-option.is-full{
  opacity: .45;
  cursor: not-allowed;
}
.event-page-wrapper .slot-full-tag{
  margin-left: auto;
  font-size: 0.85rem;
  color: #ff8a93 !important;
  letter-spacing: 1px;
}
.event-page-wrapper .btn-submit{
  width: 100%;
  padding: 15px;
  border-radius: 999px;
  border: none;
  background-color: #BCAB78 !important;
  color: #ffffff !important;
  font-size: 15px;
  letter-spacing: 3px;
  cursor: pointer;
  margin-top: 10px;
  font-family: inherit;
  transition: transform .3s ease, opacity .3s ease, box-shadow .3s ease;
}
.event-page-wrapper .btn-submit:hover{
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(188,171,120,.4);
}
.event-page-wrapper .btn-submit:disabled{ opacity: .6; cursor: wait; transform: none; }
.event-page-wrapper .form-message{
  display: none;
  padding: 14px 18px;
  border-radius: 10px;
  margin-top: 20px;
  text-align: center;
  font-size: 0.95rem;
}
.event-page-wrapper .form-message.is-success{
  display: block;
  background-color: rgba(76,175,80,.15);
  border: 1px solid rgba(76,175,80,.5);
  color: #8ee89a !important;
}
.event-page-wrapper .form-message.is-error{
  display: block;
  background-color: rgba(220,53,69,.15);
  border: 1px solid rgba(220,53,69,.5);
  color: #ff8a93 !important;
}

@media (max-width: 768px){
.event-page-wrapper .form-card{ padding: 28px 20px; }
.event-page-wrapper .form-title{ font-size: 1.28rem; letter-spacing: 2px; margin-bottom: 36px; }
.event-page-wrapper .form-group input{ font-size: 16px; }
}

html, body{
  background-color: #000000 !important;
  margin: 0;
  padding: 0;
}

</style>
</head>
<body>

<div class="event-page-wrapper">

  <!-- 1. 頂端 LOGO 區 -->
  <section class="section-logo">
    <img src="logologo.png" alt="集團 Logo" fetchpriority="high" />
  </section>

  <!-- 2. 滿版活動主視覺區：手機只下載 2-mb.jpg，桌機只下載 2-pc.jpg -->
  <section class="section-hero">
    <div class="hero-media-wrap">
      <picture>
        <source media="(max-width: 768px)" srcset="2-mb.jpg" />
        <img class="hero-media" src="2-pc.jpg" alt="活動主視覺" fetchpriority="high" decoding="async" />
      </picture>
    </div>
    <div class="hero-cta-wrap">
      <button type="button" id="scrollToRegistrationBtn" class="btn-cta">立即報名</button>
    </div>
  </section>

  <!-- 3. 主題：《獅紀：無界》卡片輪播 -->
  <section class="section-theme theme2">
    <h2 class="theme-title">《獅紀：無界》</h2>
    <p class="theme-subtitle">五 大 AI 議 題 探 索</p>
    <div class="card-carousel">
      <div class="card">
        <img src="4-1-p.jpg" alt="無界活動一" decoding="async" />
        <div class="card-text">識 ‧ 不止於見<span class="card-sub"><span class="card-sub-line">BEYOND PERSONA</span><span class="card-sub-line">所見為起點 理解於邊界之外</span></span></div>
      </div>
      <div class="card">
        <img src="4-2-i.jpg" alt="無界活動二" decoding="async" />
        <div class="card-text">獅見之境<span class="card-sub"><span class="card-sub-line">BEYOND IMAGINATION</span><span class="card-sub-line">所想 ‧ 皆能具現</span></span></div>
      </div>
      <div class="card">
        <img src="4-3-v.jpg" alt="無界活動三" decoding="async" />
        <div class="card-text">一源 ‧ ONE變<span class="card-sub"><span class="card-sub-line">BEYOND VARIATIONS</span><span class="card-sub-line">由一而生 延展萬象</span></span></div>
      </div>
      <div class="card">
        <img src="4-4-p.jpg" alt="無界活動四" decoding="async" />
        <div class="card-text">獅啟 ‧ 新序<span class="card-sub"><span class="card-sub-line">BEYOND PROCESS</span><span class="card-sub-line">不循既定 自成獅序</span></span></div>
      </div>
      <div class="card">
        <img src="4-5-t.jpg" alt="無界活動五" decoding="async" />
        <div class="card-text">共創 ‧ 無界<span class="card-sub"><span class="card-sub-line">BEYOND THE TEAM</span><span class="card-sub-line">智慧 x 專業 x 創意</span></span></div>
      </div>
    </div>
  </section>

  <!-- 4. 主題：《獅紀：百變》單張主圖 -->
  <section class="section-theme theme1">
    <h2 class="theme-title">《獅紀：百變》</h2>
    <p class="theme-subtitle">更 多 驚 喜 活 動 敬 請 期 待</p>
    <picture class="theme-single-wrap">
      <source media="(max-width: 768px)" srcset="n-4-mb.jpg" />
      <img class="theme-single-img" src="n-4-pc.jpg" alt="獅紀：百變" loading="lazy" decoding="async" />
    </picture>
  </section>

  <!-- 5. 地址時間 + Google Map / 交通資訊按鈕 -->
  <section class="section-story">
    <div class="story-bg">
      <div class="story-panel">
        <img class="story-text-img" src="%E5%9C%B0%E5%9D%80%E6%99%82%E9%96%93-%E6%96%87%E5%AD%97.jpg" alt="活動地址時間" loading="lazy" decoding="async" />
        <div class="story-btns">
          <a class="btn-info" href="https://maps.app.goo.gl/ZDPSvBSiCi5CywAcA" target="_blank" rel="noopener noreferrer">Google Map</a>
          <a class="btn-info" href="https://tpac.org.taipei/traffic-drive" target="_blank" rel="noopener noreferrer">交通資訊</a>
        </div>
      </div>
    </div>
  </section>

  <!-- 6. Registration Form 區 -->
  <section id="registration" class="section-form">
    <h2 class="form-title">立即報名</h2>
    <div class="form-card">
      <form id="registrationForm" novalidate>
        <input type="text" name="website" id="honeypot" style="position:absolute; left:-9999px; top:-9999px;" tabindex="-1" autocomplete="off">
        <div class="form-group">
          <label for="cnName">中文姓名</label>
          <input type="text" id="cnName" name="cnName" placeholder="請輸入中文姓名(必填)" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="enName">英文姓名</label>
          <input type="text" id="enName" name="enName" placeholder="請輸入英文姓名(必填)" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="company">公司名稱</label>
          <input type="text" id="company" name="company" placeholder="請輸入公司名稱(必填)" autocomplete="organization" required />
        </div>
        <div class="form-group">
          <label for="title">職稱</label>
          <input type="text" id="title" name="title" placeholder="請輸入職稱(必填)" autocomplete="organization-title" required />
        </div>
        <div class="form-group">
          <label for="email">信箱</label>
          <input type="email" id="email" name="email" placeholder="請輸入 Email(必填)" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="contact">服務窗口英文名</label>
          <input type="text" id="contact" name="contact" placeholder="請輸入集團服務窗口英文名(必填)" required />
        </div>
        <div class="form-group">
          <label>預計參加時段（必選）</label>
          <div class="slot-options">
            <label class="slot-option"><input type="radio" name="slot" value="15:00-16:00" /><span>15:00 – 16:00</span></label>
            <label class="slot-option"><input type="radio" name="slot" value="16:00-17:00" /><span>16:00 – 17:00</span></label>
            <label class="slot-option"><input type="radio" name="slot" value="17:00-18:00" /><span>17:00 – 18:00</span></label>
          </div>
        </div>
        <button type="submit" class="btn-submit">確認報名</button>
      </form>
      <div id="formMessage" class="form-message"></div>
    </div>
  </section>

</div>

<script>
document.addEventListener('DOMContentLoaded', function(){

  // 第 2 區：CTA 按鈕，點擊後平滑捲動到報名表單區
  var ctaBtn = document.getElementById('scrollToRegistrationBtn');
  if(ctaBtn){
    ctaBtn.addEventListener('click', function(){
      var target = document.getElementById('registration');
      if(target){
        target.scrollIntoView({ behavior: 'smooth' });
      }
    });
  }

  // 報名流程網址
  var FLOW_URL = "https://defaultd52c9ea17c2147b182a333a74b1f74.b8.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9e1c1881ac414019be441114075e412f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=IJY2fHMksIy_Ze84NjeJhlYKvE0kYt5dMaT9GixIozM";

  // 名額查詢流程網址
  var STATUS_URL = "https://defaultd52c9ea17c2147b182a333a74b1f74.b8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/02/workflows/4325e9be7b594d8699065d9e6bfb4ad2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=TfOopcokw_Nx4_tj4lTeQtpRP82jUmNwxmKS6UfTSPg";

  // 各時段人數上限（要調整時，報名流程的條件也要一起改）
  var SLOT_LIMITS = { "15:00-16:00": 35, "16:00-17:00": 35, "17:00-18:00": 30 };

  // 讀取各時段人數，已額滿的選項反灰、不能選
  function loadSlotStatus(){
    fetch(STATUS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    })
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(counts){
      if(!counts) return;
      document.querySelectorAll('input[name="slot"]').forEach(function(input){
        var label = input.closest('.slot-option');
        var used = Number(counts[input.value] || 0);
        var full = used >= SLOT_LIMITS[input.value];
        var tag = label.querySelector('.slot-full-tag');
        input.disabled = full;
        label.classList.toggle('is-full', full);
        if(full){
          input.checked = false;
          if(!tag){
            tag = document.createElement('span');
            tag.className = 'slot-full-tag';
            tag.textContent = '已額滿';
            label.appendChild(tag);
          }
        } else if(tag){
          tag.remove();
        }
      });
    })
    .catch(function(err){ console.error('名額查詢失敗：', err); });
  }
  loadSlotStatus();

  var form = document.getElementById('registrationForm');
  var msgBox = document.getElementById('formMessage');
  var isSubmitting = false;

  function showMsg(text, ok){
    msgBox.textContent = text;
    msgBox.className = 'form-message ' + (ok ? 'is-success' : 'is-error');
  }

  if(form){
    form.addEventListener('submit', function(e){
      e.preventDefault();

      if(isSubmitting) return;

      var honeypot = document.getElementById('honeypot');
      if(honeypot && honeypot.value !== '') return;

      var checkedSlot = form.querySelector('input[name="slot"]:checked');

      var data = {
        cnName: document.getElementById('cnName').value.trim(),
        enName: document.getElementById('enName').value.trim(),
        company: document.getElementById('company').value.trim(),
        title: document.getElementById('title').value.trim(),
        email: document.getElementById('email').value.trim(),
        contact: document.getElementById('contact').value.trim(),
        slot: checkedSlot ? checkedSlot.value : ''
      };

      if(!data.cnName || !data.enName || !data.company || !data.title || !data.email || !data.contact){
        showMsg('⚠️ 請完整填寫所有欄位。', false);
        return;
      }
      if(!data.slot){
        showMsg('⚠️ 請選擇預計參加時段。', false);
        return;
      }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)){
        showMsg('⚠️ 信箱格式不正確，請再確認。', false);
        return;
      }

      isSubmitting = true;
      var btn = form.querySelector('.btn-submit');
      btn.disabled = true;
      btn.textContent = '送出中...';

      fetch(FLOW_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(function(res){
        if(res.ok){
          showMsg('✅ 報名成功，期待當天與您相見！', true);
          form.reset();
          loadSlotStatus();
        } else if(res.status === 409){
          showMsg('⚠️ 此時段已額滿，請改選其他時段。', false);
          loadSlotStatus();
        } else {
          console.error('送出失敗，狀態碼：', res.status);
          showMsg('⚠️ 報名失敗，請稍後再試一次。', false);
        }
      })
      .catch(function(err){
        console.error('發生錯誤：', err);
        showMsg('⚠️ 網路連線異常，請稍後再試一次。', false);
      })
      .finally(function(){
        isSubmitting = false;
        btn.disabled = false;
        btn.textContent = '確認報名';
      });
    });
  }

});
</script>

</body>
</html>
